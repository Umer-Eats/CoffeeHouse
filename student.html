<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoffeeHouse - Student Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    color: var(--ink);
    font-family: "VT323", monospace;
    font-size: 20px;
    height: 100vh;
    overflow: hidden;
    transition: background-color .2s, color .2s;
  }

  /* TOP BAR */
  header{ flex-wrap: wrap; }
  .me{ display:flex; align-items:center; gap: 10px; font-size: 20px; color: var(--head-ink); }
  .avatar{
    width: 38px; height: 38px; border: 3px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center;
    font-family:"Press Start 2P"; font-size: 12px; color:#fff;
    overflow:hidden; flex-shrink:0;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .me .avatar{ width: 34px; height: 34px; font-size: 10px; }
  .me small{ display:block; color: var(--head-ink); font-size: 16px; opacity:.8; }
  .me .status-dot{ width: 9px; height: 9px; background: #3ddc55; border: 2px solid var(--head-ink); display:inline-block; }

  /* LAYOUT */
  .app{ display: grid; grid-template-columns: 250px 1fr 260px; height: calc(100vh - 66px); }
  @media (max-width: 900px){ .app{ grid-template-columns: 250px 1fr; } .side-right{ display:none; } }
  @media (max-width: 640px){ .app{ grid-template-columns: 1fr; } .side-left{ display:none; } }

  /* LEFT */
  .side-left{ background: var(--panel); border-right: 4px solid var(--line); display:flex; flex-direction:column; }
  .side-left .tabs{ display:flex; }
  .side-left .tab{
    flex:1; text-align:center; padding: 10px 4px; cursor:pointer;
    font-family:"Press Start 2P"; font-size: 9px; background: var(--panel); color: var(--soft);
    border:none; border-bottom: 3px solid var(--line);
  }
  .side-left .tab.active{ background: var(--panel2); color: var(--ink); }
  .side-left .scroller{ overflow-y:auto; flex:1; padding: 10px; }
  .side-left .scroller::-webkit-scrollbar{ width: 10px; }
  .side-left .scroller::-webkit-scrollbar-thumb{ background: var(--panel2); border: 2px solid var(--panel); }
  .class-item{ margin-bottom: 8px; }
  .class-btn{
    width:100%; text-align:left; cursor:pointer;
    background: var(--panel2); color: var(--ink);
    border: 3px solid var(--line); padding: 9px 10px; font-family:"VT323", monospace; font-size: 19px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .class-btn .chips-count{ font-family:"Press Start 2P"; font-size: 8px; background: var(--line); padding: 3px 5px; }
  .class-btn:hover{ filter: brightness(1.15); }
  .chan-list{ padding: 6px 0 8px 14px; display:flex; flex-direction:column; gap: 4px; }
  .chan{
    cursor:pointer; padding: 5px 8px; color: var(--ink); border-left: 4px solid transparent;
    display:flex; align-items:center; gap: 7px; font-size: 18px;
  }
  .chan:before{ content:"#"; color: var(--soft); }
  .chan.active{ background: var(--accentD); border-left-color: var(--accent); }
  .chan:hover{ background: var(--panel2); }
  .dm-item{
    cursor:pointer; padding: 7px 8px; margin-bottom: 4px; display:flex; align-items:center; gap: 9px;
    border: 2px solid transparent;
  }
  .dm-item:hover{ background: var(--panel2); }
  .dm-item.active{ background: var(--panel2); border: 2px solid var(--accent); }
  .dm-item small{ color: var(--soft); font-size: 15px; display:block; line-height:1.1; }

  .side-art{
    display:flex; gap: 8px; justify-content:center; align-items:flex-end;
    padding: 12px 10px; border-top: 4px solid var(--line);
    background: var(--panel2);
  }
  .side-art canvas{ image-rendering: pixelated; }
  .side-art .ta{ width: 34px; height: 34px; }
  .side-art .tl{ width: 26px; height: 33px; }
  .side-art .tm{ width: 42px; height: 28px; }

  /* CENTER */
  .chat{ display:flex; flex-direction:column; background: var(--line); }
  .chat-head{ padding: 12px 16px; background: var(--panel); border-bottom: 4px solid var(--line); }
  .chat-head h2{ font-family:"Press Start 2P"; font-size: 13px; color: var(--ink); }
  .chat-head .meta{ color: var(--soft); font-size: 17px; margin-top: 3px; }
  .msg-scroll{ flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap: 14px; }
  .msg-scroll::-webkit-scrollbar{ width: 12px; }
  .msg-scroll::-webkit-scrollbar-thumb{ background: var(--panel); border: 3px solid var(--line); }
  .day-line{ text-align:center; font-family:"Press Start 2P"; font-size: 9px; color: var(--soft); position:relative; }
  .day-line:after{ content:""; display:block; height:3px; background: var(--panel); margin-top:7px; }
  .msg{ display:flex; gap: 10px; max-width: 82%; }
  .msg.me{ align-self:flex-end; flex-direction: row-reverse; }
  .msg .avatar{ width: 36px; height: 36px; flex-shrink:0; }
  .bubble{ background: var(--panel2); border: 3px solid var(--line); padding: 9px 12px; box-shadow: 3px 3px 0 var(--shad); }
  .msg.me .bubble{ background: var(--accentD); }
  .bubble .who{ font-family:"Press Start 2P"; font-size: 8px; color: var(--soft); margin-bottom: 4px; display:flex; gap:8px; align-items:center; }
  .msg.me .bubble .who{ color: var(--ink); }
  .bubble p{ color: var(--ink); white-space: pre-wrap; }
  .bubble .time{ display:block; margin-top: 5px; font-size: 14px; color: var(--soft); text-align:right; }
  .bot-bubble{ background: var(--panel); border: 3px solid var(--accent2); box-shadow: 3px 3px 0 var(--shad); position:relative; }
  .bot-bubble .barista-chip{ background: var(--accent2); color: var(--line); font-family:"Press Start 2P"; font-size: 8px; padding: 3px 5px; display:inline-block; margin-right: 6px; }
  .bot-bubble .brewer-chip{ background: #d8a0ff; color: var(--line); font-family:"Press Start 2P"; font-size: 8px; padding: 3px 5px; display:inline-block; margin-right: 6px; }
  .bot-bubble .sparkle{ color: var(--accent2); }

  /* COMPOSER */
  .composer{ padding: 12px 14px; background: var(--panel); border-top: 4px solid var(--line); }
  .quick{ display:flex; gap: 8px; margin-bottom: 8px; }
  .quick span{
    font-family:"Press Start 2P"; font-size: 9px; padding: 5px 8px; cursor:pointer;
    background: var(--line); color: var(--ink); border: 2px solid var(--panel2);
  }
  .quick span:hover{ background: var(--panel2); }
  .quick span.cb{ border-color: var(--accent2); color: var(--accent2); }
  .quick span.cbr{ border-color: #d8a0ff; color: #d8a0ff; }
  .composer form{ display:flex; gap: 10px; }
  .composer input{
    flex:1; background: var(--line); color: var(--ink);
    border: 3px solid var(--panel2); padding: 10px 12px; font-family:"VT323", monospace; font-size: 19px;
    outline:none;
  }
  .composer input:focus{ border-color: var(--soft); }
  .composer .send{ font-family:"Press Start 2P"; font-size: 10px; padding: 10px 16px; }

  /* RIGHT */
  .side-right{ background: var(--panel); border-left: 4px solid var(--line); overflow-y:auto; }
  .side-right::-webkit-scrollbar{ width: 10px; }
  .side-right::-webkit-scrollbar-thumb{ background: var(--panel2); border: 2px solid var(--panel); }
  .panel{ padding: 14px; border-bottom: 3px solid var(--line); }
  .panel h3{ font-family:"Press Start 2P"; font-size: 10px; color: var(--accent); margin-bottom: 10px; }
  .search-box{
    width:100%; background: var(--line); color: var(--ink);
    border: 3px solid var(--panel2); padding: 8px 10px; font-family:"VT323", monospace; font-size: 18px;
    margin-bottom: 10px; outline:none;
  }
  .search-box:focus{ border-color: var(--soft); }
  .student-row{ display:flex; align-items:center; gap: 8px; padding: 6px; cursor:pointer; border: 2px solid transparent; }
  .student-row:hover{ background: var(--panel2); border-color: var(--soft); }
  .student-row small{ color: var(--soft); font-size: 14px; display:block; line-height:1.1; }
  .student-row .status-dot{ width: 8px; height: 8px; border: 2px solid var(--line); display:inline-block; margin-left:auto; }
  .group-row{ display:flex; align-items:center; gap: 8px; padding: 7px 4px; border-bottom: 2px dashed var(--panel2); }
  .group-row:last-child{ border-bottom:none; }
  .group-row .g-name{ font-size: 18px; color: var(--ink); flex:1; }
  .group-row .g-meta{ font-size: 14px; color: var(--soft); }
  .avatar-stack{ display:flex; }
  .avatar-stack .avatar{ width: 24px; height: 24px; font-size: 8px; margin-right: -8px; border-width: 2px; }
  .empty{ color: var(--soft); font-style: italic; font-size: 18px; }
</style>
<link rel="stylesheet" href="/theme.css">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://va.vercel-scripts.com/script.js"></script>
</head>
<body>

<svg class="ch-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="ch-cup" viewBox="0 0 40 40">
    <g class="steam" fill="currentColor"><path d="M17 1h2v4h-2V3h-2V0h2zm8 2h2v3h-2v3h-2V5h2z"/></g>
    <path fill="currentColor" d="M5 13h27v3h5v3h2v7h-2v3h-7v3h-4v3H11v-3H7v-5H5zm27 6v7h3v-7zM8 36h22v2H8zm-5-3h5v3H3zm27 0h5v3h-5z"/>
    <path fill="var(--coffee, #502d16)" d="M8 15h21v4H8z"/><path fill="var(--cup-shade,#e4bb7c)" d="M25 21h4v8h-3v3h-8v-2h6z"/>
  </symbol>
  <symbol id="ch-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M11 0h2v4h-2zm0 20h2v4h-2zM0 11h4v2H0zm20 0h4v2h-4zM3 3h3v3H3zm15 0h3v3h-3zM3 18h3v3H3zm15 0h3v3h-3zM8 6h8v2h2v8h-2v2H8v-2H6V8h2z"/></symbol>
  <symbol id="ch-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 1h5v2h-3v3h-2v7h2v3h3v2h7v2h-3v2H8v-2H4v-3H2V7h2V4h3V2h3z"/></symbol>
</defs></svg>

  <header>
    <a class="brand-header" href="/" aria-label="CoffeeHouse home"><svg class="ch-cup" aria-hidden="true"><use href="#ch-cup"/></svg><span>COFFEEHOUSE</span></a>
    <div class="me" id="meBox">
      <span class="avatar" id="meAvatar"></span>
      <div id="meName">... <span class="status-dot"></span>
        <small id="meSub">loading your school community...</small>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <div class="theme-toggle" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="light" aria-pressed="true"><svg aria-hidden="true"><use href="#ch-sun"/></svg>Day</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false"><svg aria-hidden="true"><use href="#ch-moon"/></svg>Night</button>
      </div>
      <a class="btn" href="/">HOME</a>
      <a class="btn" href="settings.html">SETTINGS</a>
      <a class="btn matcha" href="ai-assistant.html">AI AIDES</a>
    </div>
  </header>

  <div class="app">

    <aside class="side-left">
      <div class="tabs">
        <button class="tab active" data-tab="classes">CLASSES</button>
        <button class="tab" data-tab="dms">DIRECT MSGS</button>
      </div>
      <div class="scroller" id="classList"></div>
      <div class="side-art">
        <canvas class="tm" id="sideMoon" data-art="Moon"></canvas>
        <canvas class="ta" id="sideTree" data-art="Tree"></canvas>
        <canvas class="tl" id="sideLan" data-art="Lantern"></canvas>
      </div>
    </aside>

    <main class="chat">
      <div class="chat-head">
        <h2 id="chatTitle"># general</h2>
        <div class="meta" id="chatMeta">0 members</div>
      </div>
      <div class="msg-scroll" id="msgScroll"></div>
      <div class="composer">
        <div class="quick">
          <span data-quick=" @baristi ">ADD @baristi</span>
          <span data-quick=" @brewer ">ADD @brewer</span>
        </div>
        <form id="msgForm">
          <input id="msgInput" autocomplete="off" placeholder="Pour in a message... try @baristi 'explain photosynthesis'">
          <button class="btn send" type="submit">SEND</button>
        </form>
      </div>
    </main>

    <aside class="side-right">
      <div class="panel">
        <h3>FIND A STUDENT</h3>
        <input class="search-box" id="studentSearch" placeholder="Search by name...">
        <div id="studentList"></div>
      </div>
      <div class="panel">
        <h3>PROJECT GROUPS</h3>
        <div id="groupList"></div>
      </div>
    </aside>

  </div>

  <script src="art.js"></script>
  <script src="/app.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    /* ---------- state ---------- */
    let ME = null, SCHOOL = null;
    let STUDENTS = [], CLASSES = [], DMS = [], GROUPS = [];
    let current = { kind: 'channel', key: null };
    let lastSig = '';
    let botPing = false;

    const el = (cls, attrs, html) => {
      const d = document.createElement('div');
      d.className = cls;
      if (html !== undefined) d.innerHTML = html;
      return d;
    };

    /* ---------- boot ---------- */
    async function boot() {
      Art.initTheme();
      try {
        const me = await api('/api/me');
        ME = me.user; SCHOOL = me.school;
      } catch (e) { location.href = '/'; return; }

      if (!SCHOOL) location.href = '/'; // must pick a community first
      document.title = 'CoffeeHouse - ' + SCHOOL.name;

      const box = $('meAvatar');
      box.style.background = colorFor(ME.name);
      box.innerHTML = ME.picture ? `<img src="${esc(ME.picture)}">` : esc(initials(ME.name));
      $('meName').childNodes[0].nodeValue = ME.name + ' ';
      $('meSub').innerHTML = esc(ME.email) + ' &middot; ' + esc(SCHOOL.name);

      await Promise.all([loadChannels(), loadStudents(), loadDMs(), loadGroups()]);
      openChannel(CLASSES[0], CLASSES[0].channels[0]);
      wire();
      startPolling();
    }

    /* ---------- data loading ---------- */
    async function loadChannels() {
      const data = await api('/api/channels');
      CLASSES = data.classes;
      SCHOOL = data.school;
      $('chatMeta').textContent = `${data.members} member${data.members === 1 ? '' : 's'} in this community`;
    }

    async function loadStudents() {
      STUDENTS = await api('/api/students');
      renderStudents('');
    }

    async function loadDMs() {
      DMS = await api('/api/dms');
      renderLeft();
    }

    async function loadGroups() {
      GROUPS = await api('/api/groups');
      renderGroups();
    }

    /* ---------- navigation ---------- */
    function openChannel(clazz, chan) {
      current = { kind: 'channel', key: chan.key, title: '# ' + chan.title };
      renderChat(`# ${chan.title}`, `${clazz.members} members &middot; ${clazz.name} (${clazz.code})`);
      renderLeft();
      refreshMessages();
    }

    async function openDM(partner) {
      current = { kind: 'dm', key: 'dm:' + partner.id, title: partner.name };
      renderChat(partner.name, 'Direct message &middot; 1:1');
      renderLeft();
      await refreshMessages();
    }

    function renderChat(title, meta) {
      $('chatTitle').textContent = title;
      if (meta) $('chatMeta').textContent = meta;
      lastSig = '';
    }

    /* ---------- messages ---------- */
    async function refreshMessages() {
      if (!current.key) return;
      const msgs = await api('/api/messages?channel=' + encodeURIComponent(current.key));
      const sig = msgs.map(m => m.id).join(',');
      if (sig !== lastSig) {
        lastSig = sig;
        const scroll = $('msgScroll');
        scroll.innerHTML = '';
        scroll.appendChild(el('.day-line', null, 'TODAY'));
        msgs.forEach(m => appendMessage(m));
        scroll.scrollTop = scroll.scrollHeight;
      }
    }

    function appendMessage(m) {
      const scroll = $('msgScroll');
      const isMe = m.me;
      const row = document.createElement('div');
      row.className = 'msg' + (isMe ? ' me' : '');
      if (!isMe) {
        const av = document.createElement('span');
        av.className = 'avatar';
        av.style.background = colorFor(m.author);
        av.innerHTML = m.picture ? `<img src="${esc(m.picture)}">` : esc(initials(m.author));
        row.appendChild(av);
      }
      const bub = document.createElement('div');
      const isBaristi = /@baristi/i.test(m.text);
      const isBrewer = /@brewer/i.test(m.text);
      bub.className = 'bubble' + (isBaristi || isBrewer ? ' bot-bubble' : '');
      const whoRow = document.createElement('div');
      whoRow.className = 'who';
      whoRow.innerHTML =
        (isBaristi ? '<span class="barista-chip">BARISTI AI</span>' : '') +
        (isBrewer ? '<span class="brewer-chip">BREWER AI</span>' : '') +
        esc(isMe ? 'You' : m.author) +
        '<span class="sparkle">&#10022;</span>';
      const p = document.createElement('p');
      p.innerHTML = esc(m.text)
        .replace(/@baristi/gi, '<b style="color:#f6c978;">@baristi</b>')
        .replace(/@brewer/gi, '<b style="color:#e0b2ff;">@brewer</b>');
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = fmtTime(m.time);
      bub.appendChild(whoRow); bub.appendChild(p); bub.appendChild(time);
      row.appendChild(bub);
      scroll.appendChild(row);
      scroll.scrollTop = scroll.scrollHeight;
    }

    /* ---------- left rail ---------- */
    function renderLeft() {
      const tab = document.querySelector('.side-left .tab.active').dataset.tab;
      const box = $('classList');
      box.innerHTML = '';
      if (tab === 'classes') {
        CLASSES.forEach(c => {
          const item = el('.class-item');
          const btn = el('.class-btn', {}, `
            <span>${esc(c.code)} &#8212; ${esc(c.name)}</span>
            <span class="chips-count">${c.channels.length}</span>
          `);
          const chanList = el('.chan-list');
          c.channels.forEach(chan => {
            const ch = el('.chan' + (current.kind === 'channel' && current.key === chan.key ? ' active' : ''), {}, esc(chan.title));
            ch.addEventListener('click', () => openChannel(c, chan));
            chanList.appendChild(ch);
          });
          btn.addEventListener('click', () => {
            chanList.style.display = chanList.style.display === 'none' ? 'flex' : 'none';
          });
          chanList.style.display = 'none';
          item.appendChild(btn); item.appendChild(chanList);
          box.appendChild(item);
        });
      } else {
        if (!DMS.length) box.appendChild(el('.empty', null, 'No direct messages yet.'));
        DMS.forEach(d => {
          const row = el('.dm-item' + (current.kind === 'dm' && current.key === d.channel ? ' active' : ''));
          row.innerHTML = `
            ${avatarHTML(d.partner, '')}
            <div>${esc(d.partner.name)}<small>${esc(d.lastPreview) || 'new conversation'}</small></div>
          `;
          row.addEventListener('click', () => openDM(d.partner));
          box.appendChild(row);
        });
      }
    }

    /* ---------- right rail ---------- */
    function renderStudents(filter) {
      const box = $('studentList');
      box.innerHTML = '';
      const list = STUDENTS.filter(s => s.name.toLowerCase().includes((filter || '').toLowerCase()));
      if (!list.length) { box.appendChild(el('.empty', null, 'No students found in this school.')); return; }
      list.forEach(s => {
        const row = el('.student-row');
        row.innerHTML = `
          ${avatarHTML(s, '')}
          <div>${esc(s.name)}<small>${esc(s.email)}</small></div>
          <span class="status-dot" style="background:${s.on ? '#3ddc55' : '#7a6a55'}"></span>
        `;
        row.addEventListener('click', () => {
          $('studentSearch').value = '';
          renderStudents('');
          openDM(s);
        });
        box.appendChild(row);
      });
    }

    function renderGroups() {
      const box = $('groupList');
      box.innerHTML = '';
      if (!GROUPS.length) { box.appendChild(el('.empty', null, 'No project groups yet.')); return; }
      GROUPS.forEach(g => {
        const row = el('.group-row');
        row.innerHTML = `
          <div class="avatar-stack">${g.members.map(m => avatarHTML(m, '')).join('')}</div>
          <div class="g-name">${esc(g.name)}</div>
          <div class="g-meta">${esc(g.meta)}</div>
        `;
        box.appendChild(row);
      });
    }

    /* ---------- wiring ---------- */
    function wire() {
      document.querySelectorAll('.side-left .tab').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.side-left .tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          renderLeft();
        });
      });

      document.querySelectorAll('.quick span').forEach(q => {
        q.addEventListener('click', () => {
          const inp = $('msgInput');
          inp.value += q.dataset.quick;
          inp.focus();
        });
      });

      $('msgForm').addEventListener('submit', async e => {
        e.preventDefault();
        const inp = $('msgInput');
        const txt = inp.value.trim();
        if (!txt || !current.key) return;
        inp.value = '';
        try {
          await api('/api/messages', { method: 'POST', body: { channel: current.key, text: txt } });
          await refreshMessages();
          if (current.kind === 'dm') loadDMs();
        } catch (err) {
          alert('Could not send: ' + err.message);
        }
      });

      $('studentSearch').addEventListener('input', e => renderStudents(e.target.value));
    }

    /* ---------- polling ---------- */
    function startPolling() {
      setInterval(async () => {
        try {
          await refreshMessages();
        } catch (e) { /* channel may have changed */ }
      }, 3500);
      setInterval(() => api('/api/heartbeat', { method: 'POST' }).catch(() => {}), 30000);
      api('/api/heartbeat', { method: 'POST' }).catch(() => {});
    }

    /* ---------- theme toggle ---------- */
    (function() {
      var saved = 'light';
      try { saved = localStorage.getItem('ch-theme') || 'light'; } catch(e) {}
      function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        document.querySelectorAll('.theme-toggle button').forEach(function(b) {
          b.setAttribute('aria-pressed', b.dataset.themeChoice === theme);
        });
        try { localStorage.setItem('ch-theme', theme); } catch(e) {}
        if (typeof Art !== 'undefined') Art.refreshAll();
      }
      applyTheme(saved);
      document.querySelectorAll('.theme-toggle button').forEach(function(b) {
        b.addEventListener('click', function() { applyTheme(b.dataset.themeChoice); });
      });
    })();

    boot();
  </script>
</body>
</html>
