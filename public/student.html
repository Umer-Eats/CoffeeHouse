<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CoffeeHouse Student Hall — your virtual classroom for group projects, class discussions, and study sessions with classmates.">
<meta name="robots" content="noindex, nofollow">
<title>CoffeeHouse - Student Hall</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/study-radio.css">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://va.vercel-scripts.com/script.js"></script>
<link rel="stylesheet" href="/motion.css">
<script src="/scenery.js" defer></script>

<link rel="stylesheet" href="/groups.css">
<link rel="stylesheet" href="/notepad.css">
<link rel="stylesheet" href="/matcha-mode.css?v=1">

<script defer src="/matcha-core.js?v=1"></script>
<script defer src="/matcha-mode.js?v=1"></script>
</head>
<body class="hall-page">

<svg class="ch-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="ch-cup" viewBox="0 0 40 40">
    <g class="steam" fill="currentColor"><path d="M17 1h2v4h-2V3h-2V0h2zm8 2h2v3h-2v3h-2V5h2z"/></g>
    <path fill="currentColor" d="M5 13h27v3h5v3h2v7h-2v3h-7v3h-4v3H11v-3H7v-5H5zm27 6v7h3v-7zM8 36h22v2H8zm-5-3h5v3H3zm27 0h5v3h-5z"/>
    <path fill="var(--coffee, #502d16)" d="M8 15h21v4H8z"/><path fill="var(--cup-shade,#e4bb7c)" d="M25 21h4v8h-3v3h-8v-2h6z"/>
  </symbol>
  <symbol id="ch-sun" viewBox="0 0 24 24"><path fill="currentColor" d="M11 0h2v4h-2zm0 20h2v4h-2zM0 11h4v2H0zm20 0h4v2h-4zM3 3h3v3H3zm15 0h3v3h-3zM3 18h3v3H3zm15 0h3v3h-3zM8 6h8v2h2v8h-2v2H8v-2H6V8h2z"/></symbol>
  <symbol id="ch-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 1h5v2h-3v3h-2v7h2v3h3v2h7v2h-3v2H8v-2H4v-3H2V7h2V4h3V2h3z"/></symbol>
</defs></svg>

  <header>
    <a class="brand-header" href="/" aria-label="CoffeeHouse home"><svg class="ch-cup" aria-hidden="true"><use href="#ch-cup"/></svg><span>CoffeeHouse</span></a>
    <button id="notepadButton" class="btn matcha" type="button" aria-haspopup="dialog" aria-expanded="false">NOTEPAD</button>
    <div class="me" id="meBox">
      <span class="avatar" id="meAvatar"></span>
      <div id="meName">... <span class="status-dot"></span>
        <small id="meSub">loading your school community...</small>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button id="matchaModeButton" type="button" aria-haspopup="dialog">Matcha Mode</button>
      <div class="theme-toggle" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="light" aria-pressed="true"><svg aria-hidden="true"><use href="#ch-sun"/></svg>Day</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false"><svg aria-hidden="true"><use href="#ch-moon"/></svg>Night</button>
      </div>
      <a class="btn" href="/">HOME</a>
      <a class="btn matcha" href="ai-assistant.html">STUDY CORNER</a>
      <a class="btn" href="settings.html">SETTINGS</a>
    </div>
  </header>
  <section class="room-banner room-banner-radio">
    <div class="room-banner-copy"><p class="eyebrow">COFFEEHOUSE / COMMUNITY</p><h1>Student Hall</h1><p>Pull up a chair. Find your people, share a question, and learn together.</p></div>
    <figure class="study-radio" aria-label="Lo-fi study playlist">
      <iframe title="ICYFOG study music playlist" width="400" height="225" src="https://www.youtube-nocookie.com/embed/lSLwapzJNaE?listType=playlist&amp;list=PL9ndRPYDuLTe4zuQo8B3kfignCJ1RYyT7&amp;loop=1&amp;playsinline=1&amp;autoplay=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <div class="radio-controls" role="group" aria-label="Music controls">
        <button class="btn" type="button" data-radio="previous" aria-label="Previous video" title="Previous video" disabled>⏮</button>
        <button class="btn" type="button" data-radio="next" aria-label="Next video" title="Next video" disabled>⏭</button>
        <button class="btn" type="button" data-radio="toggle" aria-label="Play music" title="Play music" disabled>▶</button>
        <button class="btn" type="button" data-radio="up" aria-label="Increase video volume" title="Increase video volume" disabled>+</button>
        <button class="btn" type="button" data-radio="down" aria-label="Decrease video volume" title="Decrease video volume" disabled>−</button>
      </div>
      <div class="radio-stations" role="group" aria-label="Music playlists">
        <button class="btn" type="button" data-station="jazz" aria-pressed="true" disabled>Vinyl Jazz</button>
        <button class="btn" type="button" data-station="hiphop" aria-pressed="false" disabled>R&amp;B Hip Hop</button>
        <button class="btn" type="button" data-station="lockin" aria-pressed="false" disabled>Lock In</button>
        <button class="btn" type="button" data-station="indie" aria-pressed="false" disabled>Indie Pop</button>
      </div>
      <figcaption><a href="https://www.youtube.com/@ICYFOG" target="_blank" rel="noopener noreferrer">@ICYFOG</a></figcaption>
    </figure>
    <svg aria-hidden="true"><use href="#ch-cup"/></svg>
  </section>

  <div class="app">

    <aside class="side-left">
      <div class="tabs">
        <button class="tab active" data-tab="classes">Rooms</button>
        <button class="tab" data-tab="dms">Messages</button>
      </div>
      <div class="scroller" id="classList"></div>
      <div class="side-art">
        <canvas class="tm" id="sideMoon" data-art="Moon"></canvas>
        <canvas class="ta" id="sideTree" data-art="Tree"></canvas>
        <canvas class="tl" id="sideLan" data-art="Lantern"></canvas>
      </div>
    </aside>

    <main class="chat">
      <div class="chat-head">
        <h2 id="chatTitle">Choose a room</h2>
        <div class="meta" id="chatMeta">Loading your community…</div>
        <button id="editMembers" type="button" class="btn" hidden>Edit Members</button>
      </div>
      <div class="msg-scroll" id="msgScroll" role="log" aria-label="Conversation"></div>
      <div class="composer">
        <div id="hallBarista" class="companion" data-companion="barista" hidden></div>
        <div id="hallBrewer" class="companion" data-companion="brewer" hidden></div>
        <div class="quick">
          <input id="chatFileInput" type="file" accept="application/pdf,image/png,image/jpeg" hidden>
          <button id="chatFileButton" type="button">Attach file</button>
          <button type="button" data-quick=" @baristi ">ADD @baristi</button>
          <button type="button" data-quick=" @brewer ">ADD @brewer</button>
          <button id="chatFileRemove" type="button" hidden>Remove file</button>
          <span id="chatFileStatus" role="status"></span>
        </div>
        <p id="hallStatus" role="status"></p><form id="msgForm">
          <input id="msgInput" aria-label="Message" maxlength="4000" autocomplete="off" placeholder="Pour in a message... try @baristi 'explain photosynthesis'">
          <button class="btn send" type="submit">SEND</button>
        </form>
      </div>
    </main>

    <aside class="side-right">
      <div class="panel">
        <h3>FIND A STUDENT</h3>
        <input class="search-box" id="studentSearch" aria-label="Search students" placeholder="Search by name...">
        <div id="studentList"></div>
      </div>
      <div class="panel">
        <h3>PROJECT GROUPS</h3>
        <div id="groupList"></div>
        <button id="createGroup" class="btn matcha" type="button">Create Group</button>
      </div>
    </aside>

  </div>

  <dialog id="groupDialog" aria-labelledby="groupTitle">
    <button id="groupClose" class="btn" type="button" aria-label="Close group creation">×</button>
    <h2 id="groupTitle">Create Group</h2>
    <div id="groupPickStep">
      <label for="groupSearch">Find students</label><input id="groupSearch" type="search" placeholder="Search by name…" autocomplete="off">
      <div id="groupResults"></div><button id="groupMore" type="button" class="btn" hidden>Load more</button>
      <div id="groupSelected" aria-label="Selected students"></div><p id="groupSelectionCount"></p>
      <button id="groupAdd" type="button" class="btn" disabled>Add Group</button>
    </div>
    <form id="groupNameStep" hidden><label for="groupName">Name your group</label><input id="groupName" maxlength="80" required autocomplete="off"><button id="groupBack" class="btn" type="button">Back</button><button id="groupSave" class="btn matcha" type="submit">Create Group</button></form>
    <p id="groupStatus" role="status" aria-live="polite"></p>
  </dialog>
  <script src="/groups.js"></script>
  <script src="/group-members.js"></script>
  <script src="/art.js"></script>
  <script src="/app.js"></script>
  <script src="/study-radio.js"></script>
  <script src="/notepad.js"></script>
  <script src="/vendor/markdown-it/browser/markdown-it.umd.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/ai-format.js"></script>
  <script src="/companions.js"></script>
  <script src="/ai-images.js"></script>
  <script src="/chat-files.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    /* ---------- state ---------- */
    let ME = null, SCHOOL = null;
    let STUDENTS = [], CLASSES = [], DMS = [], GROUPS = [];
    let current = { kind: 'channel', key: null };
    let lastSig = null;
    const collapsedSections = new Set();
    function roomSection(button,list,key){
      const frame=document.createElement('div');frame.className='room-fold';
      const inner=document.createElement('div');inner.className='room-fold-inner';inner.appendChild(list);frame.appendChild(inner);
      button.setAttribute('role','button');button.tabIndex=0;
      function state(){const closed=collapsedSections.has(key);frame.classList.toggle('is-collapsed',closed);inner.inert=closed;button.setAttribute('aria-expanded',String(!closed));}
      state();
      button.onclick=()=>{if(collapsedSections.has(key))collapsedSections.delete(key);else collapsedSections.add(key);state();};
      return frame;
    }
    let messageCounts = {};
    function countBadge(key) {
      return unreadBadge(messageCounts[key] || 0);
    }
    function unreadBadge(count) {
      return count > 0 ? '<span class="message-count" aria-label="' + count + ' unread messages">' + Math.min(99,count) + '</span>' : '';
    }
    async function refreshCounts() {
      const counts = await api('/api/message-counts');
      if (JSON.stringify(counts) === JSON.stringify(messageCounts)) return;
      messageCounts = counts;
      const position = $('classList').scrollTop;
      renderLeft();
      $('classList').scrollTop = position;
    }
    let botPing = false;

    const el = (cls, attrs, html) => {
      const d = document.createElement('div');
      d.className = cls.replace(/\./g, '');
      if (/class-btn|chan$|chan |dm-item|student-row/.test(d.className)) {
        d.tabIndex = 0; d.setAttribute('role', 'button');
        d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); } });
      }
      if (html !== undefined) d.innerHTML = html;
      return d;
    };

    /* ---------- boot ---------- */
    async function boot() {
      Art.initTheme();
      try {
        const me = await api('/api/me');
        ME = me.user; SCHOOL = me.school;
      } catch (e) { location.href = '/'; return; }

      if (!SCHOOL) { location.href = '/?login=1'; return; } // must pick a community first
      document.title = 'CoffeeHouse - ' + SCHOOL.name;

      const box = $('meAvatar');
      box.style.background = colorFor(ME.name);
      box.innerHTML = ME.picture ? `<img src="${esc(ME.picture)}">` : esc(initials(ME.name));
      $('meName').childNodes[0].nodeValue = ME.name + ' ';
      $('meSub').innerHTML = esc(ME.email) + ' &middot; ' + esc(SCHOOL.name);

      await Promise.all([loadChannels(), loadStudents(), loadDMs(), loadGroups()]);
      if (CLASSES[0]?.channels[0]) openChannel(CLASSES[0], CLASSES[0].channels[0]);
      wire();
      startPolling();
    }

    /* ---------- data loading ---------- */
    async function loadChannels() {
      const data = await api('/api/channels');
      CLASSES = data.classes;
      SCHOOL = data.school;
      $('chatMeta').textContent = `${data.members} member${data.members === 1 ? '' : 's'} in this community`;
    }

    async function loadStudents() {
      STUDENTS = await api('/api/students');
      renderStudents($('studentSearch').value);
    }

    async function loadDMs() {
      const next = await api('/api/dms');
      if (JSON.stringify(next) !== JSON.stringify(DMS)) {
        DMS = next;
        const scroll = $('classList').scrollTop;
        renderLeft();
        $('classList').scrollTop = scroll;
      }
    }

    async function loadGroups() {
      const groups = await api('/api/groups');
      if(JSON.stringify(groups)!==JSON.stringify(GROUPS)){
        GROUPS=groups;
        if(current.key?.startsWith('channel:personal:')&&!groups.some(group=>group.channel===current.key)){
          current={kind:'channel',key:null};$('msgScroll').replaceChildren();renderChat('Choose a room','You no longer have access to that group.');
          if(window.ChatFiles)ChatFiles.clear();
          for(const key of Object.keys(messageCounts))if(key.startsWith('channel:personal:')&&!groups.some(group=>group.channel===key))delete messageCounts[key];
        }
        renderGroups();
        const position=$('classList').scrollTop;renderLeft();$('classList').scrollTop=position;
      } else if(!$('groupList').children.length) renderGroups();
    }
    function openGroup(group) {
      current={kind:'channel',key:group.channel,title:group.name};
      renderChat(group.name,'Personal group · Members only');renderLeft();
      $('editMembers').hidden=false;
      $('editMembers').textContent=group.creator_id===ME.id?'Edit Members':'View Members';
      $('editMembers').onclick=()=>group.creator_id===ME.id?GroupPicker.edit(group):GroupMembers.open(group,async()=>{
        GROUPS=GROUPS.filter(item=>item.id!==group.id);
        delete messageCounts[group.channel];
        if(current.key===group.channel){
          current={kind:'channel',key:null};$('msgScroll').replaceChildren();
          renderChat('Choose a room','You have left the group.');ChatFiles.clear();
        }
        renderGroups();renderLeft();await refreshCounts();
      });
      refreshMessages().catch(err=>{$('hallStatus').textContent=err.message;});
    }

    /* ---------- navigation ---------- */
    function openChannel(clazz, chan) {
      current = { kind: 'channel', key: chan.key, title: '# ' + chan.title };
      renderChat(`# ${chan.title}`, `${SCHOOL.name} · ${clazz.name}`);
      renderLeft();
      refreshMessages();
    }

    async function openDM(partner) {
      current = { kind: 'dm', key: 'dm:' + partner.id, title: partner.name };
      renderChat(partner.name, 'Direct message');
      renderLeft();
      await refreshMessages();
    }

    function renderChat(title, meta) {
      $('editMembers').hidden=true;
      for (const kind of ['barista','brewer']) {
        $(kind === 'barista' ? 'hallBarista' : 'hallBrewer').hidden = true;
        CoffeeCompanions.setBusy(kind, false);
      }
      $('chatTitle').textContent = title;
      if (meta) $('chatMeta').textContent = meta;
      lastSig = null;
    }

    /* ---------- messages ---------- */
    async function refreshMessages() {
      if (!current.key) return;
      const requested = current.key;
      const msgs = await api('/api/messages?channel=' + encodeURIComponent(requested));
      try {
        const pending = await api('/api/ai/pending?channel=' + encodeURIComponent(requested));
        if (requested === current.key) {
          for (const kind of ['barista','brewer']) {
            const busy = pending.some(item => item.kind === kind);
            $(kind === 'barista' ? 'hallBarista' : 'hallBrewer').hidden = !busy;
            CoffeeCompanions.setBusy(kind, busy);
          }
        }
      } catch { /* Keep conversation available if activity polling fails. */ }
      if (requested !== current.key) return;
      const sig = JSON.stringify(msgs);
      if (sig !== lastSig) {
        lastSig = sig;
        const scroll = $('msgScroll');
        scroll.innerHTML = '';
        if (!msgs.length) scroll.appendChild(el('conversation-empty', null, '<svg aria-hidden="true"><use href="#ch-cup"/></svg><h2>A fresh conversation starts here.</h2><p>Say hello or share a question with your school.</p>'));
        msgs.forEach(m => appendMessage(m));
        scroll.scrollTop = scroll.scrollHeight;
      }
      try {
        const scroll = $('msgScroll');
        if (msgs.length && document.visibilityState === 'visible' && document.hasFocus() && scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight < 24) {
          await api('/api/messages/read', {method:'POST',body:{channel:requested,lastId:msgs[msgs.length-1].id}});
        }
        await refreshCounts();
      } catch { /* Read tracking must not block the conversation. */ }
    }

    function appendMessage(m) {
      const scroll = $('msgScroll');
      const isMe = m.me;
      const botKind = m.bot ? (/brewer/i.test(m.author) ? 'brewer' : 'barista') : null;
      const row = document.createElement('div');
      row.className = 'msg' + (isMe ? ' me' : '');
      if (!isMe) {
        const av = document.createElement('span');
        av.className = 'avatar';
        av.style.background = colorFor(m.author);
        if (botKind) {
          av.className = 'avatar bot-character companion';
          av.innerHTML = CoffeeCompanions.portrait(botKind);
        } else av.innerHTML = m.picture ? `<img src="${esc(m.picture)}">` : esc(initials(m.author));
        row.appendChild(av);
      }
      const bub = document.createElement('div');
      const isBaristi = m.bot && /@baristi/i.test(m.text);
      const isBrewer = m.bot && /@brewer/i.test(m.text);
      bub.className = 'bubble' + (isBaristi || isBrewer ? ' bot-bubble' : '');
      const whoRow = document.createElement('div');
      whoRow.className = 'who';
      whoRow.textContent = botKind ? (botKind === 'brewer' ? 'Brewer' : 'Barista') : (isMe ? 'You' : m.author);
      const p = document.createElement(m.bot ? 'div' : 'p');
      if (m.bot) { p.className = 'ai-content'; p.innerHTML = AIFormat.render(m.text); }
      else p.innerHTML = esc(m.text)
        .replace(/@baristi/gi, '<b style="color:#f6c978;">@baristi</b>')
        .replace(/@brewer/gi, '<b style="color:#e0b2ff;">@brewer</b>');
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = fmtTime(m.time);
      whoRow.appendChild(time);
      bub.appendChild(whoRow); bub.appendChild(p);
      if(m.attachment){
        const link=document.createElement('a');link.href=m.attachment.url;link.textContent='Download '+m.attachment.name;link.className='attachment-link';link.setAttribute('download',m.attachment.name);
        if(m.attachment.mimeType==='image/jpeg'){const preview=document.createElement('img');preview.src=m.attachment.url;preview.alt=m.attachment.name;preview.className='chat-attachment';preview.loading='lazy';bub.appendChild(preview);}
        bub.appendChild(link);
      }
      row.appendChild(bub);
      scroll.appendChild(row);
      scroll.scrollTop = scroll.scrollHeight;
    }

    /* ---------- left rail ---------- */
    function renderLeft() {
      const tab = document.querySelector('.side-left .tab.active').dataset.tab;
      const box = $('classList');
      document.querySelector('[data-tab="classes"]').innerHTML = 'Rooms' + unreadBadge(Object.entries(messageCounts).filter(([key]) => key.startsWith('channel:')).reduce((sum,[,n]) => sum+n,0));
      document.querySelector('[data-tab="dms"]').innerHTML = 'Messages' + unreadBadge(Object.entries(messageCounts).filter(([key]) => key.startsWith('dm:')).reduce((sum,[,n]) => sum+n,0));
      box.innerHTML = '';
      if (tab === 'classes') {
        CLASSES.forEach(c => {
          const item = el('.class-item');
          const btn = el('.class-btn', {}, `
            <span>${esc(c.name)}</span>
          `);
          const chanList = el('.chan-list');
          c.channels.forEach(chan => {
            const ch = el('.chan' + (current.kind === 'channel' && current.key === chan.key ? ' active' : ''), {}, esc(chan.title));
            ch.addEventListener('click', () => openChannel(c, chan));
            ch.insertAdjacentHTML('beforeend', countBadge(chan.key));
            chanList.appendChild(ch);
          });
          item.appendChild(btn); item.appendChild(roomSection(btn,chanList,'school:'+c.code));
          box.appendChild(item);
        });
        if(GROUPS.length){
          const section=el('.class-item');
          const heading=el('.class-btn',null,'Personal Groups');
          const list=el('.chan-list');
          section.appendChild(heading);
          GROUPS.forEach(group=>{
            const button=document.createElement('button');button.type='button';button.className='chan'+(current.key===group.channel?' active':'');
            button.textContent=group.name;button.insertAdjacentHTML('beforeend',countBadge(group.channel));button.onclick=()=>openGroup(group);list.appendChild(button);
          });section.appendChild(roomSection(heading,list,'personal'));box.appendChild(section);
        }
      } else {
        if (!DMS.length) box.appendChild(el('.empty', null, 'No direct messages yet.'));
        DMS.forEach(d => {
          const row = el('.dm-item' + (current.kind === 'dm' && current.key === d.channel ? ' active' : ''));
          row.innerHTML = `
            ${avatarHTML(d.partner, '')}
            <div>${esc(d.partner.name)}<small>${esc(d.lastPreview) || 'new conversation'}</small></div>
          `;
          row.addEventListener('click', () => openDM(d.partner));
          row.insertAdjacentHTML('beforeend', countBadge(d.channel));
          box.appendChild(row);
        });
      }
    }

    /* ---------- right rail ---------- */
    function renderStudents(filter) {
      const box = $('studentList');
      box.innerHTML = '';
      const list = STUDENTS.filter(s => s.name.toLowerCase().includes((filter || '').toLowerCase()));
      if (!list.length) { box.appendChild(el('.empty', null, 'No students found in this school.')); return; }
      list.forEach(s => {
        const row = el('.student-row');
        row.innerHTML = `
          ${avatarHTML(s, '')}
          <div>${esc(s.name)}<small>${esc(s.email)}</small></div>
          <span class="status-dot" style="background:${s.on ? '#3ddc55' : '#7a6a55'}"></span>
        `;
        row.addEventListener('click', () => {
          $('studentSearch').value = '';
          renderStudents('');
          openDM(s);
        });
        box.appendChild(row);
      });
    }

    function renderGroups() {
      const box = $('groupList');
      const position=box.scrollTop;
      box.innerHTML = '';
      if (!GROUPS.length) { box.appendChild(el('.empty', null, 'Create a private group to study together.')); return; }
      GROUPS.forEach(g => {
        const row = document.createElement('button');row.type='button';row.className='group-row';row.textContent=g.name;row.onclick=()=>openGroup(g);
        const entry=document.createElement('div');entry.className='project-group-entry';entry.appendChild(row);
        if(g.creator_id===ME.id){
          const remove=document.createElement('button');remove.type='button';remove.className='group-delete';remove.textContent='×';remove.setAttribute('aria-label','Delete '+g.name);
          remove.onclick=async()=>{
            if(!confirm('Delete “'+g.name+'” for everyone? Its messages and files will be permanently removed. This cannot be undone.'))return;
            remove.disabled=true;
            try{await api('/api/groups/'+encodeURIComponent(g.id),{method:'DELETE'});await loadGroups();await refreshCounts();$('hallStatus').textContent='Group deleted.';}
            catch(err){$('hallStatus').textContent=err.message;remove.disabled=false;}
          };
          entry.appendChild(remove);
        }
        box.appendChild(entry);
      });
      box.scrollTop=position;
    }

    /* ---------- wiring ---------- */
    function wire() {
      GroupPicker.init(group=>{
        GROUPS=GROUPS.filter(item=>item.id!==group.id);GROUPS.push(group);
        document.querySelectorAll('.side-left .tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='classes'));
        renderGroups();openGroup(group);loadGroups().catch(()=>{});
      });
      document.querySelectorAll('.side-left .tab').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.side-left .tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          renderLeft();
        });
      });

      document.querySelectorAll('.quick button[data-quick]').forEach(q => {
        q.addEventListener('click', () => {
          const inp = $('msgInput');
          inp.value += q.dataset.quick;
          inp.focus();
        });
      });

      $('msgForm').addEventListener('submit', async e => {
        e.preventDefault();
        const inp = $('msgInput');
        const txt = inp.value.trim();
        const attachment=ChatFiles.get();
        if ((!txt && !attachment) || !current.key || !ChatFiles.ready()) return;
        const send = $('msgForm').querySelector('button');
        if (send.disabled) return;
        const kind = current.kind === 'channel' ? (/@barist[ai]\b/i.test(txt) ? 'barista' : /@brewer\b/i.test(txt) ? 'brewer' : null) : null;
        const companion = kind ? $(kind === 'barista' ? 'hallBarista' : 'hallBrewer') : null;
        send.disabled = true;
        const sendingChannel=current.key;
        $('hallStatus').textContent=['channel:HALL:general','channel:HALL:homework','channel:HALL:study'].includes(sendingChannel)?'Checking message…':'Sending…';
        send.textContent='SENDING…';
        ChatFiles.setBusy(true);
        if (companion) { companion.hidden = false; CoffeeCompanions.setBusy(kind, true); }
        inp.value = '';
        try {
          await api('/api/messages', { method: 'POST', body: { channel: sendingChannel, text: txt, attachment } });
          $('hallStatus').textContent='';
          ChatFiles.clear();
          await refreshMessages();
          await loadDMs();
          await loadStudents();
        } catch (err) {
          inp.value = txt;
          $('hallStatus').textContent = 'Could not send: ' + err.message;
        } finally {
          send.disabled = false;
          send.textContent='SEND';
          ChatFiles.setBusy(false);
          if (companion) { CoffeeCompanions.setBusy(kind, false); companion.hidden = true; }
        }
      });

      $('studentSearch').addEventListener('input', e => renderStudents(e.target.value));
    }

    /* ---------- polling ---------- */
    function startPolling() {
      setInterval(async () => {
        try {
          await loadGroups();
          await refreshMessages();
          await loadDMs();
        } catch (e) { /* channel may have changed */ }
      }, 3500);
      setInterval(() => api('/api/heartbeat', { method: 'POST' }).catch(() => {}), 5000);
      api('/api/heartbeat', { method: 'POST' }).catch(() => {});
    }

    /* ---------- theme toggle ---------- */
    (function() {
      var saved = 'light';
      try { saved = localStorage.getItem('ch-theme') || 'light'; } catch(e) {}
      function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        document.querySelectorAll('.theme-toggle button').forEach(function(b) {
          b.setAttribute('aria-pressed', b.dataset.themeChoice === theme);
        });
        try { localStorage.setItem('ch-theme', theme); } catch(e) {}
        if (typeof Art !== 'undefined') Art.refreshAll();
      }
      applyTheme(saved);
      document.querySelectorAll('.theme-toggle button').forEach(function(b) {
        b.addEventListener('click', function() { applyTheme(b.dataset.themeChoice); });
      });
    })();

    boot().catch(err => { $('hallStatus').textContent = 'Could not load the hall: ' + err.message; });
  </script>
</body>
</html>
