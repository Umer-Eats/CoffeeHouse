<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a2c1c">
  <title>CoffeeHouse</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #432817; font-family: system-ui, sans-serif; }
    .home-scene { position: relative; width: 100%; min-height: 100svh; overflow: hidden; background: #432817; }
    .reference-art { display: block; width: 100%; height: 100svh; object-fit: cover; object-position: center; image-rendering: pixelated; }
    .reference-art--night { display: none; }
    body[data-theme="dark"] { background: #0b0b2b; }
    body[data-theme="dark"] .home-scene { min-height: auto; background: #0b0b2b; }
    body[data-theme="dark"] .reference-art--day { display: none; }
    body[data-theme="dark"] .reference-art--night { display: block; height: auto; min-height: 100svh; object-fit: contain; object-position: top center; }
    .hotspot { position: absolute; display: block; appearance: none; border: 0; background: transparent; color: transparent; cursor: pointer; padding: 0; }
    .hotspot:focus-visible { outline: 3px solid #fff4c7; outline-offset: 3px; }
    .home-link { top: 2%; left: 26%; width: 4%; height: 6%; }
    .chat-link { top: 2%; left: 32%; width: 4%; height: 6%; }
    .study-link { top: 2%; left: 38%; width: 5%; height: 6%; }
    .profile-link { top: 2%; left: 45%; width: 5%; height: 6%; }
    .login-link { top: 1.4%; right: 34%; width: 10%; height: 6%; }
    .day-toggle { top: 1.4%; right: 12%; width: 8%; height: 6%; }
    .night-toggle { top: 1.4%; right: 4%; width: 8%; height: 6%; }
    .chat-card { left: 21%; bottom: 7%; width: 13%; height: 20%; }
    .study-card { left: 35%; bottom: 7%; width: 13%; height: 20%; }
    .groups-card { left: 50%; bottom: 7%; width: 13%; height: 20%; }
    .events-card { left: 65%; bottom: 7%; width: 13%; height: 20%; }
    .school-picker { position: fixed; inset: 0; z-index: 2; display: none; place-items: center; padding: 20px; background: rgba(0, 0, 0, .65); }
    .school-picker.is-open { display: grid; }
    .school-picker__panel { width: min(420px, 100%); padding: 26px; border: 3px solid #f4d18b; border-radius: 14px; background: #382114; color: #fff1d4; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
    .school-picker h1 { margin: 0 0 10px; font-size: 20px; }
    .school-picker p { margin: 0 0 18px; }
    .school-picker select, .school-picker button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; font: inherit; }
    .school-picker button { border: 0; background: #e4aa53; color: #2c170c; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body data-theme="light">
  <main class="home-scene" aria-label="CoffeeHouse home page">
    <img class="reference-art reference-art--day" src="/images/coffeehouse-day.png" alt="CoffeeHouse café in daylight">
    <img class="reference-art reference-art--night" src="/images/coffeehouse-night-reference.png" alt="CoffeeHouse café at night">
    <a class="hotspot home-link" href="/" aria-label="Home"></a>
    <a class="hotspot chat-link" href="student.html" aria-label="Chat"></a>
    <a class="hotspot study-link" href="ai-assistant.html" aria-label="Study"></a>
    <a class="hotspot profile-link" href="settings.html" aria-label="Profile"></a>
    <button class="hotspot login-link" id="loginBtn" type="button" aria-label="Log in"></button>
    <button class="hotspot day-toggle" type="button" data-set-theme="light" aria-label="Use day theme"></button>
    <button class="hotspot night-toggle" type="button" data-set-theme="dark" aria-label="Use night theme"></button>
    <a class="hotspot chat-card" href="student.html" aria-label="Open Chat"></a>
    <a class="hotspot study-card" href="ai-assistant.html" aria-label="Open Study"></a>
    <a class="hotspot groups-card" href="student.html" aria-label="Open Groups"></a>
    <a class="hotspot events-card" href="student.html" aria-label="Open Events"></a>
  </main>
  <section class="school-picker" id="schoolPicker" aria-modal="true" aria-labelledby="schoolHeading" role="dialog">
    <div class="school-picker__panel">
      <h1 id="schoolHeading">Welcome to CoffeeHouse</h1>
      <p id="schoolGreeting">Choose your school to join the conversation.</p>
      <select id="schoolSelect" aria-label="School"></select>
      <button id="schoolJoin" type="button">Join school</button>
    </div>
  </section>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let config = null;
    function setTheme(theme) { document.body.dataset.theme = theme; try { localStorage.setItem('ch-theme', theme); } catch (_) {} }
    document.querySelectorAll('[data-set-theme]').forEach(button => button.addEventListener('click', () => setTheme(button.dataset.setTheme)));
    async function openSchoolPicker(user) {
      $('schoolGreeting').textContent = `Welcome, ${user.name || 'student'}! Choose your school to join the conversation.`;
      const schools = await api('/api/schools');
      $('schoolSelect').innerHTML = schools.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      $('schoolPicker').classList.add('is-open');
    }
    async function afterLogin(data) { if (data.school) return location.assign('/student.html'); await openSchoolPicker(data.user); }
    async function signIn() {
      if (!config || !config.firebaseConfigured || !window.firebase) return;
      const result = await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const data = await api('/api/auth/firebase', { method: 'POST', body: { idToken: await result.user.getIdToken() } });
      await afterLogin(data);
    }
    $('loginBtn').addEventListener('click', () => signIn().catch(() => {}));
    $('schoolJoin').addEventListener('click', async () => {
      const schoolId = Number($('schoolSelect').value); if (!schoolId) return;
      await api('/api/school/join', { method: 'POST', body: { schoolId } }); location.assign('/student.html');
    });
    (async function boot() {
      try { setTheme(localStorage.getItem('ch-theme') || 'light'); } catch (_) {}
      try { config = await api('/api/config'); } catch (_) { config = { firebaseConfigured: false }; }
      if (config.firebaseConfigured && window.firebase) firebase.initializeApp(config.firebase);
    })();
  </script>
</body>
</html>
