  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="CoffeeHouse home"><svg aria-hidden="true"><use href="#cup"/></svg><span>CoffeeHouse</span></a>
    <nav class="navigation" aria-label="Main navigation"><a href="/" aria-current="page">Home</a><a href="/chat.html">Chat</a><a href="/study.html">Study</a><a href="/profile.html">Profile</a></nav>
    <button class="login-button" id="loginBtn"><svg aria-hidden="true"><use href="#user"/></svg><span>Login</span></button>
    <div class="theme-toggle" role="group" aria-label="Color theme"><button type="button" data-theme-choice="light" aria-pressed="true"><svg aria-hidden="true"><use href="#sun"/></svg>Day</button><button type="button" data-theme-choice="dark" aria-pressed="false"><svg aria-hidden="true"><use href="#moon"/></svg>Night</button></div>
  </header>
  <main class="cafe" id="main">
    <div class="scenery scenery-day" aria-hidden="true"></div><div class="scenery scenery-night" aria-hidden="true"></div>
    <section class="welcome" aria-labelledby="title">
      <svg class="hero-cup" aria-hidden="true"><use href="#cup"/></svg>
      <h1 id="title">CoffeeHouse</h1>
      <p class="tagline">Chat. Study. Grow. Together.</p>
      <p class="intro">Your cozy space for<br>communication and study.</p>
    </section>
  </main>

  <dialog id="accountDialog" aria-labelledby="accountTitle">
    <button class="close-dialog" type="button" aria-label="Close dialog">×</button>
    <svg class="dialog-cup" aria-hidden="true"><use href="#cup"/></svg>
    <h2 id="accountTitle">Welcome to CoffeeHouse</h2>
    <p id="accountHint">Pull up a chair. Sign in to join your school community.</p>
    <button class="primary-button" id="googleLogin">Continue with Google</button>
    <form id="devForm" hidden><label>Email<input id="devEmail" type="email" autocomplete="email" required></label><label>Name<input id="devName" autocomplete="name" required></label><button class="primary-button">Sign in locally</button></form>
    <form id="schoolForm" hidden><label>Your school<select id="schoolSelect" required></select></label><button class="primary-button">Join your school</button></form>
    <p id="loginStatus" role="status" aria-live="polite"></p>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/home.js" defer></script>
